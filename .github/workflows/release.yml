name: Release

# Builds the programs and publishes them as a GitHub Release: two packages,
# eupdate-x.y-firebee.zip and eupdate-x.y.zip (the guidelines 7.4), the
# FireBee's uploaded first: EUpdate 2.14 and older unpack every zip of a
# release in its order, so the standard one must come last. Two ways to
# start it:
# - Actions > Release > Run workflow, on main, with the notes: it tags
#   main's commit vX.Y, from VERSION;
# - push a tag vX.Y that matches VERSION: the tag's message
#   (git tag -a) is the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What is new (Markdown): the release's notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            if [ "$TAG" != "v$V" ]; then
              echo "::error::tag $TAG, but VERSION says $V"
              exit 1
            fi
          else
            TAG=v$V
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::run it on main"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is out already: tools/bump.py and commit first"
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding), and apt retries; on 13 Nov kernel.org was
          # unreachable in turn (EContact): three mirrors, the runner's apt takes the next that answers, IPv4
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y gcc-m68k-linux-gnu zip autoconf automake libtool gettext autopoint pkg-config
      - name: hcp, for the help file
        run: common/tools/build-hcp.sh "$RUNNER_TEMP/hcp"
      - name: Test
        run: make test
      - name: Build
        run: make dist HCP="$RUNNER_TEMP/hcp/hcp"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          V=$(cat VERSION)
          # one upload at a time (gh uploads a list side by side), the
          # FireBee's first, and the order checked as the API gives it
          gh release create "$TAG" "dist/eupdate-$V-firebee.zip" --target "$GITHUB_SHA" --title "${GITHUB_REPOSITORY#*/} $V" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "dist/eupdate-$V.zip"
          ORDER=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(" ")')
          echo "assets: $ORDER"
          test "$ORDER" = "eupdate-$V-firebee.zip eupdate-$V.zip"
